# Сборка Wavelet для Windows, macOS, Linux и Android на машинах GitHub и выкладка релиза.
# Запуск: метка вида v1.0.0 (git tag v1.0.0 && git push origin v1.0.0) — после сборки создаётся релиз с файлами.
# Вручную (Actions → Release → Run workflow) — только сборка, файлы в Artifacts, без релиза.
# Подпись Android: секреты ANDROID_KEYSTORE_B64 (wavelet.jks в base64) и ANDROID_KEYSTORE_PROPERTIES (keystore.properties).
# Без этих секретов apk подписывается временным ключом, созданным здесь же (ставится, но не поверх своей подписи).
# iPhone: неподписанный .ipa (подпись отключена через XCODE_XCCONFIG_FILE) — ставится через AltStore / Sideloadly.

name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: app
        run: cargo tauri build --bundles nsis
      - name: Collect
        shell: pwsh
        run: |
          $v = (Get-Content app/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/release/bundle/nsis/*-setup.exe" "dist/Wavelet_${v}_windows_x64_setup.exe"
          Copy-Item "target/release/Wavelet.exe" "dist/Wavelet_${v}_windows_x64_portable.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: app
        run: cargo tauri build --target universal-apple-darwin --bundles dmg
      - name: Collect
        run: |
          v=$(jq -r .version app/tauri.conf.json)
          mkdir dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/Wavelet_${v}_macos_universal.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: app
        run: cargo tauri build --bundles deb,rpm,appimage
      - name: Collect
        run: |
          v=$(jq -r .version app/tauri.conf.json)
          mkdir dist
          cp target/release/bundle/deb/*.deb "dist/Wavelet_${v}_linux_amd64.deb"
          cp target/release/bundle/rpm/*.rpm "dist/Wavelet_${v}_linux_x86_64.rpm"
          cp target/release/bundle/appimage/*.AppImage "dist/Wavelet_${v}_linux_amd64.AppImage"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p android-keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android-keystore/wavelet.jks
            printf '%s\n' "$KEYSTORE_PROPERTIES" > android-keystore/keystore.properties
          else
            pw=$(openssl rand -hex 16)
            keytool -genkeypair -keystore android-keystore/wavelet.jks -alias wavelet -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pw" -keypass "$pw" -dname "CN=Wavelet"
            printf 'storeFile=wavelet.jks\nstorePassword=%s\nkeyAlias=wavelet\nkeyPassword=%s\n' "$pw" "$pw" > android-keystore/keystore.properties
          fi
      - name: Build
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          chmod +x gen/android/gradlew
          cargo tauri android build --apk
      - name: Collect
        run: |
          v=$(jq -r .version app/tauri.conf.json)
          mkdir dist
          cp app/gen/android/app/build/outputs/apk/universal/release/*.apk "dist/Wavelet_${v}_android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Xcode project
        working-directory: app
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cargo tauri ios init --ci
      - name: Turn off signing
        working-directory: app/gen/apple
        run: |
          # в каждый набор настроек проекта Xcode — без подписи (настройки проекта главнее XCODE_XCCONFIG_FILE)
          for f in $(find . -name project.pbxproj); do
            perl -0pi -e 's/buildSettings = \{/buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";\n\t\t\t\tEXPANDED_CODE_SIGN_IDENTITY = "";/g; s/^\s*(DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_ENTITLEMENTS) = [^;]*;\n//mg' "$f"
          done
          # project.yml — на случай, если сборка заново создаст проект из него
          if [ -f project.yml ]; then
            perl -pi -e 's/^(\s*)base:\s*$/$1base:\n$1  CODE_SIGNING_ALLOWED: NO\n$1  CODE_SIGNING_REQUIRED: NO\n$1  CODE_SIGN_IDENTITY: ""/' project.yml
          fi
          grep -c "CODE_SIGNING_ALLOWED = NO" $(find . -name project.pbxproj)
      - name: Build (unsigned)
        working-directory: app
        continue-on-error: true # выгрузка из архива требует подписи и падает — сам .app к этому времени готов
        run: cargo tauri ios build --target aarch64 --ci
      - name: Collect
        run: |
          v=$(jq -r .version app/tauri.conf.json)
          app=$(find app/gen/apple ~/Library/Developer/Xcode -path '*.xcarchive/Products/Applications/*.app' -prune 2>/dev/null | head -1)
          [ -z "$app" ] && app=$(find app/gen/apple ~/Library/Developer/Xcode/DerivedData -type d -name '*.app' -path '*-iphoneos/*' -prune 2>/dev/null | head -1)
          echo "app: $app"
          test -n "$app"
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          (cd dist && zip -qry "Wavelet_${v}_ios_unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Wavelet $GITHUB_REF_NAME" --notes "Music and video player with a library, tag search, playlists, visualizer and color schemes.

          - Windows: \`*_windows_x64_setup.exe\` (installer) or \`*_portable.exe\` (no install).
          - macOS: \`*_macos_universal.dmg\` (Intel and Apple Silicon). The app is not signed: right-click → Open the first time.
          - Linux: \`.deb\`, \`.rpm\` or \`.AppImage\`.
          - Android 7+: \`*_android.apk\`.
          - iPhone / iPad (iOS 14+): \`*_ios_unsigned.ipa\` — unsigned, install with AltStore or Sideloadly using your Apple ID."
