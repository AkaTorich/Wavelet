[package]
name = "wavelet-core"
version.workspace = true
edition.workspace = true
description = "Wavelet — библиотека: база, обход папок, теги, поиск"

[lib]
name = "wavelet_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
