<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wavelet</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/lists.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 5.2v13.6a.9.9 0 0 0 1.4.75L15 13v5.5a1 1 0 0 0 2 0v-13a1 1 0 0 0-2 0V11L5.4 4.45A.9.9 0 0 0 4 5.2z"/><rect x="18" y="4.5" width="2.2" height="15" rx="1.1"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M20 5.2v13.6a.9.9 0 0 1-1.4.75L9 13v5.5a1 1 0 0 1-2 0v-13a1 1 0 0 1 2 0V11l9.6-6.55A.9.9 0 0 1 20 5.2z"/><rect x="3.8" y="4.5" width="2.2" height="15" rx="1.1"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c4.5 0 6.5 10 11 10H21M3 17h3.5c1.6 0 2.9-1.3 4-3M13.5 10c1.1-1.7 2.4-3 4-3H21"/><path d="M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V9.5A3.5 3.5 0 0 1 7.5 6H19M20 12v2.5a3.5 3.5 0 0 1-3.5 3.5H5"/><path d="M16 3l3 3-3 3M8 21l-3-3 3-3"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V9.5A3.5 3.5 0 0 1 7.5 6H19M20 12v2.5a3.5 3.5 0 0 1-3.5 3.5H5"/><path d="M16 3l3 3-3 3M8 21l-3-3 3-3"/><path d="M11.2 10.4 12.6 9.6v5"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.7a.9.9 0 0 0 1.6-.7V5.5a.9.9 0 0 0-1.6-.7L8 8.5H5a1 1 0 0 0-1 1z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.7a.9.9 0 0 0 1.6-.7V5.5a.9.9 0 0 0-1.6-.7L8 8.5H5a1 1 0 0 0-1 1z"/><path d="m17 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h12M4 11h12M4 16h7"/><path d="M15 14.5v5.5l4.5-2.75z" fill="currentColor" stroke-linejoin="round"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17.5V6.6a1 1 0 0 1 .8-1l9-1.9a1 1 0 0 1 1.2 1v11.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><ellipse cx="6.5" cy="17.5" rx="3" ry="2.5"/><ellipse cx="17.5" cy="16" rx="3" ry="2.5"/></symbol>
  <symbol id="i-album" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 6.5a5.5 5.5 0 0 0-5.5 5.5" stroke-linecap="round" opacity=".6"/></symbol>
  <symbol id="i-artist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M17.5 4.5v8.2"/><circle cx="16" cy="13" r="1.8" fill="currentColor"/><path d="M17.5 4.5l3 1"/></symbol>
  <symbol id="i-genre" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18v-4M7 18V8M11 18v-7M15 18V5M19 18v-9"/><path d="M2 21h20" opacity=".5"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="14" height="14" rx="2.5"/><path d="m16.5 10.5 5-3v9l-5-3z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.8l2 2.2h7.2A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-6.4 6.4a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8.3" cy="8.3" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-recent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-frequent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M4 12h5M13 12h7"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/><circle cx="11" cy="12" r="2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8z"/></symbol>
  <symbol id="i-rescan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-wave" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c4 0 5-1 7 1s2 4 4 1 2-11 5-11 3 18 6 18 3-14 6-14 2.5 7 4.5 7 3-2 5-2 3 0 6 0"/></symbol>
  <symbol id="i-sub" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 13h4M13 13h4M7 16h7"/></symbol>
</svg>

<div id="app">
  <aside id="nav">
    <div class="brand"><svg class="logo"><use href="#i-wave"/></svg><span>Wavelet</span></div>
    <div class="nav-group" id="nav-main"></div>
    <div class="nav-caption">Списки</div>
    <div class="nav-group" id="nav-playlists"></div>
    <div id="scan-status" hidden>
      <div class="scan-line"><span class="led"></span><span id="scan-text">Обход папок…</span></div>
      <progress id="scan-bar" max="1" value="0"></progress>
    </div>
  </aside>

  <main id="main">
    <header id="top">
      <button class="icon-btn" id="back" title="Назад" hidden><svg class="ic"><use href="#i-back"/></svg></button>
      <div class="search-box">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Поиск: название, исполнитель, альбом, жанр, метка…">
      </div>
      <select id="sort" title="Порядок"></select>
    </header>
    <section id="view"></section>
    <section id="stage" hidden>
      <video id="media" playsinline preload="metadata"></video>
      <div id="stage-title"></div>
      <button class="icon-btn" id="stage-close" title="Свернуть видео"><svg class="ic"><use href="#i-down"/></svg></button>
    </section>
  </main>

  <aside id="queue" hidden>
    <header><h2>Очередь</h2><span id="queue-info" class="dim"></span>
      <button class="icon-btn" id="queue-save" title="Сохранить как список"><svg class="ic"><use href="#i-list"/></svg></button>
      <button class="icon-btn" id="queue-clear" title="Очистить"><svg class="ic"><use href="#i-close"/></svg></button>
    </header>
    <div id="queue-list"></div>
  </aside>

  <footer id="bar">
    <div class="now" id="now">
      <div class="cover" id="now-cover"></div>
      <div class="now-text"><div id="now-title" class="title">Ничего не играет</div><div id="now-sub" class="dim"></div></div>
    </div>
    <div class="transport">
      <div class="buttons">
        <button class="icon-btn" id="btn-shuffle" title="Перемешать"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="btn-prev" title="Предыдущая"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="icon-btn play" id="btn-play" title="Играть"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="btn-next" title="Следующая"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="btn-repeat" title="Повтор"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="timeline">
        <span id="t-cur" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1">
        <span id="t-dur" class="time">0:00</span>
      </div>
    </div>
    <div class="extras">
      <button class="icon-btn" id="btn-video" title="Показать видео" hidden><svg class="ic"><use href="#i-video"/></svg></button>
      <button class="icon-btn" id="btn-subs" title="Субтитры" hidden><svg class="ic"><use href="#i-sub"/></svg></button>
      <button class="icon-btn" id="btn-full" title="Во весь экран (F)" hidden><svg class="ic"><use href="#i-full"/></svg></button>
      <button class="icon-btn" id="btn-addlist" title="Добавить в список" hidden><svg class="ic"><use href="#i-plus"/></svg></button>
      <button class="icon-btn" id="btn-queue" title="Очередь"><svg class="ic"><use href="#i-queue"/></svg></button>
      <button class="icon-btn" id="btn-mute" title="Звук"><svg class="ic"><use href="#i-volume"/></svg></button>
      <input id="volume" type="range" min="0" max="100" value="80" title="Громкость">
    </div>
  </footer>

  <nav id="tabs"></nav>
</div>

<div id="sheet" hidden>
  <header><button class="icon-btn" id="sheet-close" title="Свернуть"><svg class="ic"><use href="#i-down"/></svg></button>
    <span class="dim">Сейчас играет</span>
    <button class="icon-btn" id="sheet-queue" title="Очередь"><svg class="ic"><use href="#i-queue"/></svg></button></header>
  <div class="sheet-cover" id="sheet-cover"></div>
  <div class="sheet-text"><div id="sheet-title" class="title"></div><div id="sheet-sub" class="dim"></div></div>
  <div class="timeline"><span id="s-cur" class="time">0:00</span><input id="s-seek" type="range" min="0" max="1000" value="0"><span id="s-dur" class="time">0:00</span></div>
  <div class="buttons big">
    <button class="icon-btn" id="s-shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
    <button class="icon-btn" id="s-prev"><svg class="ic"><use href="#i-prev"/></svg></button>
    <button class="icon-btn play" id="s-play"><svg class="ic"><use href="#i-play"/></svg></button>
    <button class="icon-btn" id="s-next"><svg class="ic"><use href="#i-next"/></svg></button>
    <button class="icon-btn" id="s-repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
  </div>
</div>

<div id="menu" class="popup" hidden></div>
<div id="modal-host"></div>
<div id="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
